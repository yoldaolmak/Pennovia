name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pennovia-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: |
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q pennovia
      - name: Static correctness
        run: python -m ruff check pennovia tests
      - name: Test and report coverage
        run: python -m pytest -q --cov=pennovia --cov-report=term-missing --cov-fail-under=80 tests/
      - name: Bug-prone Python patterns
        run: python -m ruff check --select B pennovia
      - name: CLI smoke test
        run: |
          pennovia --version
          pennovia studio --help
      - name: Studio browser script syntax
        run: node --check pennovia/studio/app.js
      - name: Offline demo
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
        run: python -m pennovia.demo

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build CLI container
        run: docker build -t pennovia-ci .
      - name: CLI and offline demo
        run: |
          docker run --rm pennovia-ci --version
          docker run --rm pennovia-ci demo

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distribution wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/pennovia-wheel-env"
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -m pip install dist/pennovia-*.whl
      - name: Exercise installed package outside source checkout
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
          PENNOVIA_BACKEND: auto
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" --version
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" demo
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -c 'from pathlib import Path; import pennovia.demo; p = Path(pennovia.demo.__file__).parent / "corpus"; assert len(list(p.glob("*.txt"))) == 3'
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" studio --help
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -c 'from importlib.resources import files; p = files("pennovia.studio"); assert all(p.joinpath(f).is_file() for f in ("index.html", "app.css", "app.js"))'

  studio-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install browser test dependencies
        run: python -m pip install -e '.[dev]' 'playwright>=1.55,<2'
      - name: Identify Playwright browser version
        id: playwright-version
        run: python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pennovia-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Ensure Chromium system dependencies
        run: python -m playwright install-deps chromium
      - name: Install Chromium when absent
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Real desktop and mobile Studio smoke test
        run: python -m pytest -q tests/test_studio_browser.py tests/test_studio_state_transitions.py
      - name: Save synthetic Studio screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-desktop-mobile
          path: ${{ runner.temp }}/studio-screenshots/*.png
          if-no-files-found: ignore
